# Internal synthetic-only verification. This workflow never connects to hosted Supabase,
# sends email/SMS, applies migrations, or operates on real customer data.
name: Internal CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Synthetic Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EMAIL_PROVIDER: console
      ENABLE_LIVE_EMAIL: 'false'
      ENABLE_SYNTHETIC_EMAIL_VALIDATION: 'false'
      ENABLE_RETENTION_MAINTENANCE: 'false'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # No SUPABASE_SERVICE_ROLE_KEY, provider credentials, or hosted database URL.

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A false positive is not acceptable: any unknown or executable change
      # must keep all current application checks. Stable job name preserved.
      - name: Classify PR change scope (fail closed)
        id: scope
        shell: bash
        run: bash .github/scripts/classify-ci-changes.sh

      - name: Verify change-scope classifier fixtures
        shell: bash
        run: bash .github/scripts/test-ci-change-scope.sh

      - name: Documentation-only verification
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Markdown-only PR verified by safe change classifier; executable checks preserved for other changes."

      - name: Install pnpm
        if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Use Node.js
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Enforce inactive production gates
        shell: bash
        run: |
          test "$EMAIL_PROVIDER" = "console"
          test "$ENABLE_LIVE_EMAIL" = "false"
          test "$ENABLE_RETENTION_MAINTENANCE" = "false"
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -n "${RESEND_API_KEY:-}" ] || [ -n "${STRIPE_SECRET_KEY:-}" ]; then
            echo "Forbidden production/database credential exposed to synthetic CI"
            exit 1
          fi

      - name: Install frozen dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm lint

      # App Router global LayoutProps/PageProps are generated by Next.js
      # and do not exist on a clean checkout until typegen runs.
      - name: Generate Next.js route types
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm exec next typegen

      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm typecheck

      # Intentionally explicit allowlist: test/domain/cas.test.ts and many
      # integration files open a database and MUST NOT run in this no-DB job.
      # Database integration tests require a separately authorized isolated
      # synthetic database and may not target the hosted engineering project.
      - name: Run isolated domain and mocked interface tests
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pnpm exec vitest run \
            test/domain/activation-readiness.test.ts \
            test/domain/billing.test.ts \
            test/domain/billing-catalog.test.ts \
            test/domain/billing-configuration.test.ts \
            test/domain/provider-evidence-port.test.ts \
            test/domain/synthetic-invoice-projection-correlation.test.ts \
            test/domain/synthetic-invoice-finality-plan.test.ts \
            test/domain/synthetic-frozen-invoice-consistency.test.ts \
            test/domain/synthetic-invoice-evidence-chain.test.ts \
            test/domain/mr5i4e-invoice-finality-nonactivation.test.ts \
            test/domain/mr5i4h-billing-surface-nonactivation.test.ts \
            test/domain/billing-workspace-organization-selection.test.ts \
            test/domain/billing-workspace-organization-page.test.ts \
            test/domain/usage-organization-context.test.ts \
            test/domain/usage-organization-page.test.ts \
            test/domain/usage-summary-read-integrity.test.ts \
            test/domain/active-organization-policy.test.ts \
            test/domain/server-active-organization.test.ts \
            test/domain/subscription-lifecycle-proposals.test.ts \
            test/domain/synthetic-exception-reconciliation.test.ts \
            test/domain/stripe-subscription-candidate.test.ts \
            test/domain/stripe-recovery-preflight.test.ts \
            test/domain/stripe-recovery-operator.test.ts \
            test/domain/stripe-test-worker-environment-gates.test.ts \
            test/domain/stripe-test-provider-construction-gates.test.ts \
            test/domain/stripe-test-checkout-preflight.test.ts \
            test/domain/stripe-test-checkout-start.test.ts \
            test/domain/billing-ui-state.test.ts \
            test/domain/stripe-test-customer-provisioning.test.ts \
            test/domain/stripe-test-customer-portal.test.ts \
            test/domain/stripe-test-billing-action-admission.test.ts \
            test/domain/stripe-test-action-request.test.ts \
            test/domain/stripe-test-billing-action-route.test.ts \
            test/domain/stripe-test-recovery-diagnostics.test.ts \
            test/domain/stripe-test-provider-recovery.test.ts \
            test/domain/stripe-test-recovery-review.test.ts \
            test/domain/support-billing-recovery.test.ts \
            test/domain/support-subscription-exceptions.test.ts \
            test/domain/admin-billing-review-pages.test.ts \
            test/domain/completion-api.test.ts \
            test/domain/completion-ingestion-schema.test.ts \
            test/domain/completion.test.ts \
            test/domain/dashboard-operational-status.test.ts \
            test/domain/destination.test.ts \
            test/domain/economics.test.ts \
            test/domain/eligibility.test.ts \
            test/domain/email-composition.test.ts \
            test/domain/mr7b1-authority-send-invariant.test.ts \
            test/domain/mr7b3-payload-minimization.test.ts \
            test/domain/reminder-composition.test.ts \
            test/domain/reminder-policy.test.ts \
            test/domain/restore-delta-replay.test.ts \
            test/domain/restore-privacy-verification.test.ts \
            test/domain/retention-controls.test.ts \
            test/domain/retention-maintenance.test.ts \
            test/domain/review-request-transitions.test.ts \
            test/domain/sanitizer.test.ts \
            test/domain/suppression.test.ts \
            test/domain/tracking.test.ts \
            test/domain/trial-entitlement.test.ts \
            test/integration/client-activation-page-context.test.ts \
            test/integration/quick-complete-action-authorization.test.ts \
            test/integration/navigation-feedback.test.ts \
            test/integration/redirect-safety.test.ts \
            test/integration/staging-readiness.test.ts

      - name: Production compile and build (synthetic configuration)
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm build
