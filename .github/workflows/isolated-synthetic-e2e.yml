# Disposable, repository-local Supabase stack for the database-backed synthetic
# E2E harness. Never connect this job to hosted Supabase or customer accounts.
name: Isolated Synthetic E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-e2e:
    name: Synthetic Quick Complete / Outbox / Redirect
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      EMAIL_PROVIDER: console
      ENABLE_LIVE_EMAIL: 'false'
      ENABLE_SYNTHETIC_EMAIL_VALIDATION: 'false'
      ENABLE_RETENTION_MAINTENANCE: 'false'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331

    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep the existing required job name, but skip Docker only when every
      # PR change is allowlisted Markdown. Any uncertain scope runs full E2E.
      - name: Classify PR change scope (fail closed)
        id: scope
        shell: bash
        run: bash .github/scripts/classify-ci-changes.sh

      - name: Documentation-only verification
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          echo "Markdown-only PR: disposable database work not needed."

      - name: Install pnpm
        if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify isolated-only settings
        shell: bash
        run: |
          set -euo pipefail
          test "$EMAIL_PROVIDER" = "console"
          test "$ENABLE_LIVE_EMAIL" = "false"
          test "$ENABLE_RETENTION_MAINTENANCE" = "false"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "http://127.0.0.1:54331"
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -n "${RESEND_API_KEY:-}" ] || [ -n "${STRIPE_SECRET_KEY:-}" ]; then
            echo "Unexpected hosted database or external provider credential in CI"
            exit 1
          fi

      - name: Install locked dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      # Runner-owned ephemeral Docker network/database. The CLI uses the
      # repository's migrations and seed fixtures; no project linking, db push,
      # remote reset, hosted account, or provider credential is used.
      - name: Start disposable local Supabase
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 25
        run: |
          pnpm dlx supabase@2.117.0 start \
            -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor,mailpit

      - name: Load ephemeral local API credentials
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx supabase@2.117.0 status -o env > "$RUNNER_TEMP/mpg-synthetic-supabase.env"
          source "$RUNNER_TEMP/mpg-synthetic-supabase.env"
          test "$API_URL" = "http://127.0.0.1:54331"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run scoped synthetic database-backed E2E test
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pnpm exec vitest run \
            test/integration/true-e2e.test.ts \
            test/integration/stripe-subscription-projection-atomic.test.ts \
            test/integration/stripe-webhook-processing-leases.test.ts \
            test/integration/stripe-fenced-reconciliation.test.ts \
            test/integration/stripe-reconciliation-worker.test.ts \
            test/integration/stripe-signed-synthetic-worker-journey.test.ts \
            test/integration/stripe-test-checkout-preflight.test.ts \
            test/integration/stripe-test-checkout-reservations.test.ts \
            test/integration/stripe-test-customer-provisioning.test.ts \
            test/integration/stripe-test-customer-portal.test.ts \
            test/integration/stripe-test-billing-action-rate-limit.test.ts \
            test/integration/stripe-test-billing-recovery-diagnostics.test.ts \
            test/integration/stripe-test-provider-recovery-context.test.ts \
            test/integration/stripe-test-recovery-review-intake.test.ts \
            test/integration/stripe-invoice-truth.test.ts \
            test/integration/stripe-invoice-webhook-reference.test.ts \
            test/integration/stripe-test-invoice-inbox.test.ts \
            test/integration/stripe-test-invoice-processing.test.ts \
            test/integration/billing-invoice-completion-quarantine.test.ts \
            test/integration/stripe-test-private-invoice-read-assembler.test.ts \
            test/integration/billing-paid-entitlement-proposals.test.ts \
            test/integration/billing-synthetic-invoice-evidence-drafts.test.ts \
            test/integration/billing-synthetic-checkout-quote-snapshots.test.ts \
            test/integration/billing-synthetic-checkout-to-invoice-journey.test.ts \
            test/integration/billing-usage-authenticated-multi-org.test.ts \
            test/integration/mr5i5-consolidated-private-table-privileges.test.ts \
            test/integration/billing-synthetic-proposal-admission.test.ts \
            test/integration/billing-synthetic-proposal-ordering.test.ts \
            test/integration/billing-synthetic-exception-review.test.ts \
            test/integration/support-billing-recovery.test.ts \
            test/integration/support-subscription-exceptions.test.ts

      # Queue-wide synthetic tests run separately, not against other test fixtures.
      - name: Verify TEST-only retry scheduling and queue dispatch
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm exec vitest run test/integration/stripe-test-recovery-dispatcher.test.ts

      - name: Verify sealed recovery operator against disposable Supabase
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm exec vitest run test/integration/stripe-recovery-operator.test.ts

      # This test exercises the global TEST webhook queue using signed local
      # ingress and the existing sealed operator. Keep it after other fixture
      # suites so it cannot claim their in-flight synthetic events.
      - name: Verify sealed signed TEST webhook recovery dispatch
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm exec vitest run test/integration/stripe-signed-local-operator-dispatch.test.ts

      - name: Stop and erase disposable local Supabase containers
        if: always() && steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: pnpm dlx supabase@2.117.0 stop --no-backup
